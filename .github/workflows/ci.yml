name: Kronos Social AI - CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build --workspace=client

      - name: Validate server syntax
        run: node --check server/src/server.js

      - name: Validate auth module syntax
        run: |
          node --check server/src/middleware/auth.js
          node --check server/src/modules/auth/auth.routes.js
          node --check server/src/modules/auth/session.routes.js
          node --check server/src/modules/auth/session.service.js

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run client tests
        working-directory: client
        run: npm test

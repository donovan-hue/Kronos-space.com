name: Kronos Deploy Verify

# Verificación de despliegue (SOLO LECTURA): programada los días hábiles y bajo demanda.
#
# Úsalo después de cambiar variables de entorno o redesplegar:
#   gh workflow run "Kronos Deploy Verify"
#   gh workflow run "Kronos Deploy Verify" -f base=https://api.kronos-space.com
#
# No crea ni modifica datos: consulta el health, los encabezados CORS y la
# URL de API compilada en el bundle del frontend.

on:
  # La comprobación existía solo para quien la pidiera a mano: un despliegue que
  # se rompe un miércoles por la tarde no la activaba y nadie la corría hasta el
  # siguiente redespliegue. Programada, es una lectura del health, del CORS y del
  # bundle publicado —sin secretos, sin escritura, sin costo de proveedor—, así
  # que se puede lanzar sola. Los `inputs` quedan: en una corrida programada van
  # vacíos y `scripts/verify-deploy.sh` usa sus valores por defecto, que son los
  # mismos hosts que se ponen abajo para el resumen.
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      base:
        description: "URL de la API (backend real)"
        required: true
        type: string
        default: "https://api.kronos-space.com"
      frontend:
        description: "URL del frontend desplegado"
        required: true
        type: string
        default: "https://kronos-space.com"
      origins:
        description: "Orígenes a comprobar en CORS (separados por coma)"
        required: true
        type: string
        default: "https://kronos-space.com,https://www.kronos-space.com"
      report_pr:
        description: "Número de PR donde publicar el informe (vacío = solo en el log). Sirve también para PRs ya fusionados."
        required: false
        type: string
        default: ""
      frontend_alt:
        description: "Alias técnico a auditar excepcionalmente (vacío por defecto; no es una URL pública)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kronos-verify-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify deployed environment (read-only)
        id: verify_deploy
        continue-on-error: true
        env:
          BASE: ${{ inputs.base }}
          FRONTEND: ${{ inputs.frontend }}
          FRONTEND_ALT: ${{ inputs.frontend_alt }}
          ORIGINS: ${{ inputs.origins }}
        run: |
          set -o pipefail
          bash scripts/verify-deploy.sh | tee /tmp/verify-deploy.txt

      - name: Publish report
        if: always() && inputs.report_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.report_pr }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy.txt
            echo '```'
          } > /tmp/report.md

          gh pr comment "$PR" --body-file /tmp/report.md || echo "No se pudo publicar el informe"

      - name: Resumen
        if: always()
        env:
          BASE: ${{ inputs.base }}
          FRONTEND: ${{ inputs.frontend }}
          ORIGINS: ${{ inputs.origins }}
          RESULTADO: ${{ steps.verify_deploy.outcome }}
        run: |
          # Los `inputs` vienen vacíos en una corrida programada: el valor por
          # defecto se aplica aquí, en shell, con la misma cadena que usa
          # `scripts/verify-deploy.sh`. Interpolar `inputs` en el bloque `run`
          # está prohibido a propósito (`server/test/workflows.contract.test.js`):
          # GitHub sustituye la expresión antes de que el shell vea nada, y un
          # input con comillas se convierte en el script del paso.
          BASE="${BASE:-https://api.kronos-space.com}"
          FRONTEND="${FRONTEND:-https://kronos-space.com}"
          ORIGINS="${ORIGINS:-https://kronos-space.com,https://www.kronos-space.com}"
          {
            echo "## Verificación de despliegue"
            echo
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| API | ${BASE} |"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Orígenes | ${ORIGINS} |"
            echo "| Resultado | ${RESULTADO} |"
            echo
            echo '```text'
            cat /tmp/verify-deploy.txt 2>/dev/null || echo '(sin salida)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Se difiere el fallo para publicar primero el informe, no para ocultarlo.
      # Un resultado omitido/cancelado tampoco certifica el despliegue.
      - name: Exigir verificación satisfactoria
        if: always() && steps.verify_deploy.outcome != 'success'
        run: |
          echo "::error title=Despliegue NO verificado::La comprobación no terminó correctamente. Revisa el resumen de esta ejecución."
          exit 1

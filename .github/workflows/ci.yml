name: Kronos Space - CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: kronos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronos-build
          path: |
            client/dist
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sweep inert utilities
        run: node scripts/ci/barrido-utilidades.mjs --estricto

      - name: Validate server syntax
        run: |
          set -euo pipefail
          node --check server/src/server.js
          node --check server/src/config/openrouter.js
          node --check server/src/modules/image-ai/image.capabilities.js
          node --check scripts/openrouter-smoke.js

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run client tests
        working-directory: client
        run: npm test

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kronos-build
          path: client/dist

      - name: Browser tests
        env:
          KRONOS_BROWSER_PRODUCTION: "1"
        working-directory: client
        run: npm run test:browser

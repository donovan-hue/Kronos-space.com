name: Kronos Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: kronos-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./guardian
        run: npm ci

      - name: Validate dependency tree
        working-directory: ./guardian
        run: npm ls --all

      - name: Validate Guardian syntax
        working-directory: ./guardian
        run: find src -name '*.js' -exec node --check {} \;

      - name: Run Kronos Guardian
        working-directory: ./guardian
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node src/index.js


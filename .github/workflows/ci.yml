name: Kronos Space - CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# M-10: permiso mínimo por defecto. Solo el job `report` (que publica
# comentarios) recibe escritura, y únicamente donde la necesita.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    # M-9: MongoDB real también en el CI de push — sin él, los 70 tests E2E
    # del servidor se skipean y el gate verde cubre solo ~64%.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ci
      JWT_SECRET: kronos-ci-validate-secret
      NODE_ENV: test

    outputs:
      verify: ${{ steps.verify_deploy.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Validate server syntax
        run: node --check server/src/server.js

      - name: Validate auth and core modules syntax
        run: |
          node --check server/src/middleware/auth.js
          node --check server/src/modules/auth/auth.routes.js
          node --check server/src/modules/auth/session.routes.js
          node --check server/src/modules/auth/session.service.js
          node --check server/src/modules/moderation/moderation.routes.js
          node --check server/src/modules/moderation/moderation.service.js
          node --check server/src/modules/drafts/drafts.routes.js
          node --check server/src/modules/posts/posts.routes.js
          node --check server/src/modules/users/users.routes.js
          node --check server/src/modules/search/search.routes.js
          node --check server/src/modules/admin/admin.routes.js
          node --check server/src/modules/observability/observability.routes.js
          node --check server/src/middleware/requestContext.js
          node --check server/src/middleware/requireAdmin.js

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run client tests
        working-directory: client
        run: npm test

      # Verificación de SOLO LECTURA contra los despliegues reales
      # (Render + Cloudflare Pages/Vercel). No crea ni modifica datos.
      # No bloquea el merge: informa si la configuración del entorno
      # (CLIENT_URL en Render, VITE_API_URL en el frontend) necesita ajuste.
      - name: Verify deployed environment (read-only)
        id: verify_deploy
        continue-on-error: true
        env:
          BASE: https://api.kronos-space.com
          # Único frontend público. Los alias deben redirigir aquí, no operar
          # como una segunda versión que el usuario tenga que elegir.
          FRONTEND: https://kronos-space.com
          FRONTEND_ALT: ""
          ORIGINS: https://kronos-space.com,https://www.kronos-space.com
        run: bash scripts/verify-deploy.sh | tee /tmp/verify-deploy.txt

      - name: Upload deploy verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-deploy-${{ github.run_id }}
          path: /tmp/verify-deploy.txt
          if-no-files-found: warn

  # Publica el informe de verificación como comentario. Vive en un job
  # separado para que `validate` (que ejecuta código del PR) opere con
  # `contents: read` y la escritura quede acotada a este job.
  report:
    runs-on: ubuntu-latest
    needs: validate
    if: always()

    permissions:
      contents: write # comentarios de commit (push)
      pull-requests: write # comentarios de PR

    steps:
      - name: Download deploy verification output
        uses: actions/download-artifact@v4
        with:
          name: verify-deploy-${{ github.run_id }}
          path: /tmp/verify-deploy

      - name: Publish deploy report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Resultado: **${{ needs.validate.outputs.verify }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy/verify-deploy.txt
            echo '```'
          } > /tmp/report.md

          gh pr comment "$PR" --body-file /tmp/report.md || echo "No se pudo publicar el informe"

      # En push (main/develop) no hay PR: el informe se publica como
      # comentario del commit, que queda legible en la interfaz y por API.
      - name: Publish deploy report (push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Commit: \`${SHA:0:7}\`"
            echo
            echo "Resultado: **${{ needs.validate.outputs.verify }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy/verify-deploy.txt
            echo '```'
          } > /tmp/report-push.md

          gh api "repos/${REPO}/commits/${SHA}/comments" -F body=@/tmp/report-push.md > /dev/null \
            || echo "No se pudo publicar el informe"

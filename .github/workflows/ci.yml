name: Kronos Space - CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: kronos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow YAML
        run: npm run validate:workflows

      - name: Test workflow validation
        run: npm run test:workflows

      - name: Audit dependencies (including development tools)
        run: npm run audit:dependencies

      - name: Validate dependency tree
        run: npm ls --all

      - name: Lint (client, server, scripts, guardian)
        run: npm run lint

      - name: Build client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronos-build
          path: |
            client/dist
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` por un solo paso: el chequeo de espacios necesita
          # la base de comparación. Sin historial, `git merge-base` falla y el
          # paso se volvería un ruido rojo en cada PR.
          fetch-depth: 0

      - name: Whitespace and conflict markers (git diff --check)
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.base_ref }}" "${GITHUB_SHA}")"
          else
            base="$(git rev-parse -q --verify "${GITHUB_SHA}^" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          # Espacios al final, tabulaciones sueltas y restos de `<<<<<<<`:
          # tres cosas que un formateo distruido deja en el diff y que ningún
          # linter de este repo cazaba (las reglas de estilo las discute el
          # propietario, no el lint).
          git diff --check "$base" "${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kronos-build
          path: client/dist

      - name: Sweep inert utilities
        run: node scripts/ci/barrido-utilidades.mjs --estricto

      - name: Validate server syntax
        run: |
          set -euo pipefail
          node --check server/src/server.js
          node --check server/src/config/openrouter.js
          node --check server/src/modules/image-ai/image.capabilities.js
          node --check scripts/openrouter-smoke.js

      - name: Validate auth and core modules syntax
        run: |
          set -euo pipefail
          node --check server/src/middleware/auth.js
          node --check server/src/modules/auth/auth.routes.js
          node --check server/src/modules/auth/session.routes.js
          node --check server/src/modules/auth/session.service.js
          node --check server/src/modules/moderation/moderation.routes.js
          node --check server/src/modules/moderation/moderation.service.js
          node --check server/src/modules/drafts/drafts.routes.js
          node --check server/src/modules/posts/posts.routes.js
          node --check server/src/modules/users/users.routes.js
          node --check server/src/modules/search/search.routes.js
          node --check server/src/modules/admin/admin.routes.js
          node --check server/src/modules/observability/observability.routes.js
          node --check server/src/middleware/requestContext.js
          node --check server/src/middleware/requireAdmin.js

      - name: Sweep declared mocks (E2E y navegador sin dobles ocultos)
        run: node scripts/ci/barrido-no-mock.mjs --estricto

      - name: Run server tests
        working-directory: server
        run: |
          set -uo pipefail
          # El TAP se guarda completo: si el filtro de abajo falla hay que poder
          # leer qué omitió el runner. `not ok` lo detecta el propio filtro, así
          # que el veredicto de este paso es la unión de las dos cosas.
          npm test -- --test-reporter=tap > /tmp/server-tests.tap 2>&1
          estado=$?
          node ../scripts/ci/presupuesto-skip.mjs --estricto < /tmp/server-tests.tap
          presupuesto=$?
          if [ "$presupuesto" -ne 0 ] || [ "$estado" -ne 0 ]; then
            echo "--- últimas 80 líneas del TAP ---"
            tail -n 80 /tmp/server-tests.tap
          fi
          [ "$presupuesto" -ne 0 ] && exit "$presupuesto"
          exit "$estado"

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Verify deployed environment (read-only)
        id: verify_deploy
        continue-on-error: true
        env:
          BASE: https://api.kronos-space.com
          FRONTEND: https://kronos-space.com
          FRONTEND_ALT: ""
          ORIGINS: https://kronos-space.com,https://www.kronos-space.com
          CORS_ATTEMPTS: "2"
          CORS_DELAY: "5"
        run: |
          set -o pipefail
          bash scripts/verify-deploy.sh | tee /tmp/verify-deploy.txt

      - name: Publish deploy report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            if [ -f /tmp/verify-deploy.txt ]; then
              cat /tmp/verify-deploy.txt
            else
              echo "(sin salida de verify-deploy)"
            fi
            echo '```'
          } > /tmp/report.md

          gh pr comment "$PR" --body-file /tmp/report.md || echo "No se pudo publicar el informe"

      - name: Publish deploy report (push)
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Commit: \`${SHA:0:7}\`"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            if [ -f /tmp/verify-deploy.txt ]; then
              cat /tmp/verify-deploy.txt
            else
              echo "(sin salida de verify-deploy)"
            fi
            echo '```'
          } > /tmp/report-push.md

          gh api "repos/${REPO}/commits/${SHA}/comments" -F body=@/tmp/report-push.md > /dev/null \
            || echo "No se pudo publicar el informe"

  cobertura:
    name: Umbrales de cobertura
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 aquí, y solo aquí, a propósito: los umbrales se leen de la
      # tabla que imprime `--experimental-test-coverage`, y `--test-coverage-include`
      # (sin él la media incluiría los propios archivos de prueba) existe desde
      # la 22. El resto del CI sigue en 20, que es el runtime declarado en
      # `server/package.json` y el de la plataforma; cambiarlo es decisión del
      # propietario, no de este paso.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage floors (server + client contracts)
        run: npm run coverage

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kronos-build
          path: client/dist

      - name: Browser tests
        env:
          KRONOS_BROWSER_PRODUCTION: "1"
        working-directory: client
        run: npm run test:browser

      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kronos-browser-${{ github.run_id }}
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

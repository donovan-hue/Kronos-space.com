name: Kronos E2E (MongoDB real)

# Verificación real de los bloques entregados y de la autenticación
# end-to-end (cada suite de bloque vive en server/test/block-*.e2e.test.js
# y se ejecuta con el mismo `npm run test:e2e`).
#
# - `mongo-real`: corre SIEMPRE contra un servidor MongoDB real (imagen
#   oficial mongo:7). Sin dobles, sin base en memoria y sin persistencia
#   simulada: las pruebas usan la base fija `test` y limpian únicamente
#   documentos/colecciones creados por su ejecución.
# - `atlas`: corre el mismo E2E contra MONGODB_URI (tu Atlas) cuando el
#   secreto existe, también en base temporal aislada. Si no existe, deja
#   un aviso claro en lugar de inventar una base.
#
# Configuración Atlas E2E:
#   Secret: KRONOS_E2E_MONGODB_URI (usuario dedicado, permisos solo sobre `test`)
#   Variable: KRONOS_E2E_CLUSTER_ALLOWLIST (hostname exacto del cluster E2E verificado)
#   Nunca reutilizar la credencial de producción.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  mongo-real:
    name: E2E contra MongoDB real (mongo:7)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # Base sintética del flujo genérico. El contrato productivo se prueba aparte
      # con un fixture loopback cuyo origen sí se llama exactamente kronos-space-com.
      MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ci_chain
      KRONOS_E2E_MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ci_chain
      KRONOS_E2E_RUN_ID: local-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: kronos-ci-e2e-secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Instalar mongodb-database-tools (mongodump/mongorestore)
        run: |
          set -euo pipefail
          VER=100.10.0
          curl -fsSL -o /tmp/mdbtools.tgz \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${VER}.tgz"
          tar -xzf /tmp/mdbtools.tgz -C /tmp
          sudo cp /tmp/mongodb-database-tools-*/bin/* /usr/local/bin/
          mongodump --version | head -2
          mongorestore --version | head -2

      - name: Esperar a MongoDB
        run: |
          for intento in $(seq 1 30); do
            if node -e "
              const net = require('net');
              const socket = net.connect(27017, '127.0.0.1');
              socket.on('connect', () => { socket.end(); process.exit(0); });
              socket.on('error', () => process.exit(1));
            "; then
              echo "MongoDB responde en 127.0.0.1:27017"
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB no respondió a tiempo"
          exit 1

      - name: Pruebas E2E de bloques (MongoDB real, sin dobles)
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/kronos-e2e.txt
          # El código de la tubería es el de `tee` (siempre 0): hay que
          # leer el del primer comando o los fallos E2E nunca rompen el paso.
          exit_code=${PIPESTATUS[0]}

          # --- Diagnostico visible como anotaciones ----------------
          # Prioridad 1: marcador emitido por el propio archivo de
          # pruebas (nombre de la prueba + error completo).
          grep "KRONOS_E2E_FAIL" /tmp/kronos-e2e.txt \
            | head -14 \
            | while IFS= read -r linea; do
                echo "::error title=Kronos E2E fallo::${linea:0:300}"
              done

          # Prioridad 2: lineas "not ok" del TAP (indentadas o no)
          # con el detalle que les sigue.
          awk '
            /(^|[[:space:]])not ok / {
              print "::error title=Kronos E2E TAP::" substr($0, 1, 300)
              capturar = 10
              next
            }
            capturar > 0 { print "::error title=Kronos E2E TAP detalle::" substr($0, 1, 300); capturar-- }
          ' /tmp/kronos-e2e.txt | head -40

          # Prioridad 3: con fallos pero sin ninguna de las dos senales,
          # volcar cabecera y colas del archivo para ver su formato real
          # (solo en corridas con fallos, para no llenar de anotaciones
          # las corridas verdes).
          fail_n=$(sed -n 's/^# fail //p' /tmp/kronos-e2e.txt | head -1)
          if ! grep -q "not ok\|KRONOS_E2E_FAIL" /tmp/kronos-e2e.txt && [ "${fail_n:-0}" != "0" ]; then
            head -n 45 /tmp/kronos-e2e.txt | nl -ba | while IFS= read -r linea; do
              echo "::notice title=E2E cabecera::${linea:0:200}"
            done
            tail -n 35 /tmp/kronos-e2e.txt | nl -ba | while IFS= read -r linea; do
              echo "::notice title=E2E cola::${linea:0:200}"
            done
          fi

          exit $exit_code

      - name: Publicar informe del E2E
        if: always()
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          set +e

          if [ ! -f /tmp/kronos-e2e.txt ]; then
            echo "Sin salida del E2E"
            exit 0
          fi

          resumen=$(grep -E "^# (tests|pass|fail|skipped)" /tmp/kronos-e2e.txt | tr '\n' ' ')
          echo "::notice title=Kronos E2E resumen (mongo:7)::${resumen:-sin resumen legible}"

          {
            echo "### Kronos E2E — MongoDB real (mongo:7)"
            echo
            printf 'Commit: `%s`\n' "${SHA:0:7}"
            echo
            echo '```text'
            tail -n 120 /tmp/kronos-e2e.txt
            echo '```'
          } > /tmp/kronos-e2e-report.md

          # El informe se publica en el resumen del run (pestaña Summary):
          # visible sin ruido y sin permisos extra. tee también lo deja en
          # el log del paso.
          tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" < /tmp/kronos-e2e-report.md

          exit 0

      - name: Guardar salida del E2E
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kronos-e2e-${{ github.run_id }}
          path: /tmp/kronos-e2e.txt
          if-no-files-found: warn

      # Cadena completa de base de datos contra el MongoDB real del job.
      # Es la única forma de dar por buena una migración: inventario, respaldo
      # verificado, restauración probada en OTRA base, simulación, aplicación,
      # idempotencia, validación de integridad, explain() real, multimedia y
      # vuelta atrás hasta cero. Cualquier fallo rompe el PR.
      - name: Cadena de base de datos (inventario → respaldo → migración → validación)
        run: |
          set -uo pipefail

          fallos=0

          # Cada comando se ejecuta aunque el anterior falle: una sola corrida
          # tiene que explicar TODO lo que está roto, no solo lo primero. El
          # detalle sale como anotación porque el log completo del job no
          # siempre es accesible desde donde se revisa.
          ejecutar() {
            titulo="$1"
            shift
            echo "::group::${titulo}"
            if "$@" > /tmp/paso.txt 2>&1; then
              tail -n 25 /tmp/paso.txt
              echo "::endgroup::"
              # El resultado se publica como anotación: es la evidencia que
              # se revisa sin abrir el log completo del job.
              resumen=$(grep -vE '^\s*$' /tmp/paso.txt | tail -n 3 | tr '\n' ' ' | cut -c1-600)
              echo "::notice title=DB · ${titulo}::${resumen}"
            else
              codigo=$?
              tail -n 50 /tmp/paso.txt
              echo "::endgroup::"
              detalle=$(tail -n 8 /tmp/paso.txt | tr '\n' ' ' | cut -c1-600)
              echo "::error title=DB · ${titulo} (salida ${codigo})::${detalle}"
              fallos=$((fallos + 1))
            fi
          }

          ejecutar "inventario de código" node scripts/db/code-inventory.js
          ejecutar "auditoría de esquema" node scripts/db/schema-audit.js
          ejecutar "inventario de la base" node scripts/db/inventory.js
          # Flujo exclusivo de ensayo: no reutiliza el contrato productivo.
          ejecutar "respaldo" node scripts/ci/trial-backup-restore.js --out /tmp/kronos-backup
          ejecutar "verificación del respaldo" node scripts/ci/trial-backup-restore.js --check /tmp/kronos-backup
          ejecutar "restauración probada" node scripts/ci/trial-backup-restore.js --restore /tmp/kronos-backup --target-uri mongodb://127.0.0.1:27017/kronos_restore_proof
          ejecutar "catálogo de migraciones" node scripts/db/migrate.js validate
          ejecutar "estado inicial" node scripts/db/migrate.js status
          ejecutar "simulación" node scripts/db/migrate.js up --dry-run
          ejecutar "aplicación" node scripts/db/migrate.js up --backup /tmp/kronos-backup
          ejecutar "idempotencia" node scripts/db/migrate.js up --backup /tmp/kronos-backup
          ejecutar "estado tras aplicar" node scripts/db/migrate.js status
          ejecutar "integridad de datos" node scripts/db/validate-data.js --counts
          ejecutar "auditoría de índices" node scripts/db/index-audit.js --verbose
          ejecutar "multimedia" node scripts/db/media-orphans.js
          ejecutar "vuelta atrás a cero" node scripts/db/migrate.js down --to 0
          ejecutar "reaplicación" node scripts/db/migrate.js up --backup /tmp/kronos-backup

          if [ "$fallos" -gt 0 ]; then
            echo "::error title=Cadena de base de datos::${fallos} comandos fallaron"
            exit 1
          fi

          echo "Cadena de base de datos completa contra MongoDB real."

      - name: Contrato productivo · fixture local legítimo y restore aislado
        env:
          # Nombres exactos del contrato productivo, sobre el mongo:7 efímero,
          # sin credenciales y nunca sobre datos reales.
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos-space-com
          MONGODB_TARGET_URI: mongodb://127.0.0.1:27017/kronos_restore
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/kronos-production-contract-backup
          node scripts/ci/prepare-production-restore-fixture.js
          node scripts/backup-verify.js --out /tmp/kronos-production-contract-backup
          node scripts/backup-verify.js --check /tmp/kronos-production-contract-backup
          node scripts/backup-verify.js --restore /tmp/kronos-production-contract-backup \
            --target-db kronos_restore
          node - <<'NODE'
          const manifest = require('/tmp/kronos-production-contract-backup/manifest.json');
          if (manifest.database !== 'kronos-space-com') throw new Error('Origen contractual incorrecto');
          if (manifest.verification !== 'RESTORE_VERIFIED') throw new Error('Restore contractual no verificado');
          if (manifest.restoreTarget !== 'kronos_restore') throw new Error('Target contractual incorrecto');
          if (manifest.verifiedCollections < 1 || manifest.verifiedDocuments < 2) {
            throw new Error('El fixture contractual no produjo evidencia suficiente');
          }
          console.log('OK: contrato productivo verificado con fixture local efímero.');
          NODE

      # FASES 9 y 11-16: la cadena anterior demuestra que los comandos
      # funcionan, pero corre sobre la base del E2E, casi vacía y con los
      # índices ya creados por autoIndex. Un explain() ahí no prueba nada.
      #
      # Este paso levanta una base de ENSAYO independiente, la puebla con
      # volumen realista usando el driver (sin modelos, luego sin autoIndex)
      # y ejecuta encima el ciclo completo: inventario con datos, respaldo,
      # restauración comparada en OTRA base, explain antes y después de los
      # índices, percentiles, integridad, multimedia, detección de anomalías
      # y ensayo de rollback.
      # FASES 9 y 11-16: la cadena anterior demuestra que los comandos
      # funcionan, pero corre sobre la base del E2E, casi vacía y con los
      # índices ya creados. Un explain() ahí no prueba nada.
      #
      # Aquí se levanta una base de ENSAYO independiente, poblada con volumen
      # realista mediante el driver (sin modelos, luego sin autoIndex), y se
      # ejecuta encima el ciclo completo. Está repartido en varios pasos
      # porque GitHub solo conserva 10 anotaciones por paso y la evidencia
      # del final es tan necesaria como la del principio.
      - name: Ensayo · siembra y estado previo
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ensayo
          ETIQUETA: ENSAYO
        run: |
          set -uo pipefail
          source scripts/ci/evidencia.sh

          ejecutar "siembra de la base de ensayo" \
            node scripts/db/seed-staging.js --confirm kronos_ensayo --reset
          ejecutar "inventario con datos" node scripts/db/inventory.js

          # La base tiene datos y solo el índice _id_. Que estas dos
          # herramientas protesten ES la evidencia del estado previo.
          medir_antes "explain sin índices" node scripts/db/index-audit.js --verbose
          medir_antes "percentiles sin índices" \
            node scripts/db/bench-queries.js --samples 7 --label antes

          fin "Ensayo · estado previo"

      - name: Ensayo · respaldo, restauración y migración
        if: always()
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ensayo
          ETIQUETA: ENSAYO
        run: |
          set -uo pipefail
          source scripts/ci/evidencia.sh

          ejecutar "respaldo del ensayo" \
            node scripts/ci/trial-backup-restore.js --out /tmp/kronos-ensayo-backup
          ejecutar "verificación del respaldo" \
            node scripts/ci/trial-backup-restore.js --check /tmp/kronos-ensayo-backup
          ejecutar "restauración comparada en otra base" \
            node scripts/ci/trial-backup-restore.js --restore /tmp/kronos-ensayo-backup \
              --target-uri mongodb://127.0.0.1:27017/kronos_migration_test

          ejecutar "estado inicial" node scripts/db/migrate.js status
          ejecutar "simulación" node scripts/db/migrate.js up --dry-run
          ejecutar "aplicación" \
            node scripts/db/migrate.js up --backup /tmp/kronos-ensayo-backup
          ejecutar "idempotencia (segunda pasada)" \
            node scripts/db/migrate.js up --backup /tmp/kronos-ensayo-backup
          ejecutar "estado tras aplicar" node scripts/db/migrate.js status

          fin "Ensayo · migración"

      - name: Ensayo · explain con índices, percentiles e integridad
        if: always()
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ensayo
          ETIQUETA: ENSAYO
        run: |
          set -uo pipefail
          source scripts/ci/evidencia.sh

          # Mismos datos que en el paso previo, ahora con los índices que
          # creó la migración 004: la comparación es directa.
          ejecutar "explain con índices" node scripts/db/index-audit.js --verbose
          ejecutar "percentiles y comparación antes/después" \
            node scripts/db/bench-queries.js --samples 15 --label despues
          ejecutar "integridad con datos" node scripts/db/validate-data.js --counts
          ejecutar "multimedia con datos" node scripts/db/media-orphans.js
          ejecutar "ensayo de detección" node scripts/db/detection-drill.js

          fin "Ensayo · medición e integridad"

      - name: Ensayo · TTL con datos vencidos (R-08)
        if: always()
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ensayo
          ETIQUETA: ENSAYO
        run: |
          set -uo pipefail
          source scripts/ci/evidencia.sh

          # Los TTL del plan borran documentos al crearse. Este ensayo siembra
          # vencidos a propósito, observa el borrado, demuestra que dropIndex
          # NO lo revierte y que el respaldo sí lo recupera.
          ejecutar "ensayo de TTL con datos vencidos" node scripts/db/ttl-drill.js

          fin "Ensayo · TTL"

      - name: Ensayo · rollback y reaplicación
        if: always()
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kronos_ensayo_rollback
          ETIQUETA: ENSAYO
        run: |
          set -uo pipefail
          source scripts/ci/evidencia.sh

          # El rollback necesita una base que AÚN NO esté migrada: lo que
          # demuestra es que el ciclo completo devuelve el estado inicial, y
          # reutilizar la base ya migrada haría la comparación imposible.
          ejecutar "siembra de la base de rollback" \
            node scripts/db/seed-staging.js --confirm kronos_ensayo_rollback --reset --scale 0.2
          ejecutar "respaldo de la base de rollback" \
            node scripts/ci/trial-backup-restore.js --out /tmp/kronos-rollback-backup
          ejecutar "verificación del respaldo de rollback" \
            node scripts/ci/trial-backup-restore.js --check /tmp/kronos-rollback-backup
          # Migrar exige RESTORE_VERIFIED: el flujo aislado también debe
          # demostrar una restauración local real antes de sellar el ensayo.
          ejecutar "restauración probada del respaldo de rollback" \
            node scripts/ci/trial-backup-restore.js --restore /tmp/kronos-rollback-backup \
              --target-uri mongodb://127.0.0.1:27017/kronos_rollback_restore
          ejecutar "ensayo de rollback con datos TTL vencidos" \
            node scripts/db/rollback-drill.js --backup /tmp/kronos-rollback-backup \
              --seed-expired 8 --allow-ttl-deletions

          fin "Ensayo · rollback"

      - name: Guardar informes de base de datos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kronos-db-reports-${{ github.run_id }}
          path: |
            docs/db/reports/
            /tmp/kronos-backup/manifest.json
            /tmp/kronos-backup/restore-proof.json
            /tmp/kronos-production-contract-backup/manifest.json
            /tmp/kronos-production-contract-backup/restore-proof.json
            /tmp/kronos-ensayo-backup/manifest.json
            /tmp/kronos-ensayo-backup/restore-proof.json
            /tmp/kronos-rollback-backup/manifest.json
            /tmp/kronos-rollback-backup/restore-proof.json
          if-no-files-found: warn

      # El E2E real ya se ejecutó arriba con mongo:7. Esta pasada comprueba
      # únicamente los contratos sin DB; retirar la URI evita volver a lanzar
      # en paralelo todas las suites E2E contra conexiones temporales.
      - name: Suites del servidor sin base de datos
        run: env -u MONGODB_URI npm test --workspace=server

      - name: Suites del cliente
        run: npm test --workspace=client

      - name: Build del cliente
        run: npm run build --workspace=client

  atlas:
    name: E2E contra Atlas (secreto KRONOS_E2E_MONGODB_URI)
    runs-on: ubuntu-latest

    env:
      # Credencial dedicada exclusivamente al workload Atlas `test`.
      # Nunca reutilizar el secreto de producción.
      KRONOS_E2E_MONGODB_URI: ${{ secrets.KRONOS_E2E_MONGODB_URI }}
      KRONOS_E2E_RUN_ID: atlas-${{ github.run_id }}-${{ github.run_attempt }}
      # Se mantiene fail-closed hasta que el operador declare el hostname
      # exacto del cluster E2E ya verificado. No se acepta un bypass.
      KRONOS_E2E_CLUSTER_ALLOWLIST: ${{ vars.KRONOS_E2E_CLUSTER_ALLOWLIST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'kronos-ci-e2e-secret' }}
      NODE_ENV: test

    steps:
      - name: Comprobar disponibilidad del secreto
        id: secreto
        run: |
          if [ -z "${KRONOS_E2E_MONGODB_URI}" ]; then
            echo "::error title=Configuración E2E incompleta::Falta el secret KRONOS_E2E_MONGODB_URI dedicado a Atlas/test."
            exit 1
          fi
          if [ -z "${KRONOS_E2E_CLUSTER_ALLOWLIST}" ]; then
            echo "::error title=Configuración E2E incompleta::Falta la variable KRONOS_E2E_CLUSTER_ALLOWLIST; la guarda permanece fail-closed."
            exit 1
          fi
          echo "disponible=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=E2E Atlas habilitado::Se ejecuta contra la base fija test; la base nunca se elimina."

      - name: Checkout
        if: steps.secreto.outputs.disponible == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.secreto.outputs.disponible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.secreto.outputs.disponible == 'true'
        run: npm ci

      - name: Pruebas E2E contra Atlas (base Atlas fija `test`)
        if: steps.secreto.outputs.disponible == 'true'
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/kronos-atlas-e2e.txt
          # Ídem: sin PIPESTATUS el exit code es el de tee y el gate no existe.
          exit_code=${PIPESTATUS[0]}

          # --- Diagnostico visible como anotaciones ----------------
          # Prioridad 1: marcador emitido por el propio archivo de
          # pruebas (nombre de la prueba + error completo).
          grep "KRONOS_E2E_FAIL" /tmp/kronos-atlas-e2e.txt \
            | head -14 \
            | while IFS= read -r linea; do
                echo "::error title=Kronos E2E Atlas fallo::${linea:0:300}"
              done

          # Prioridad 2: lineas "not ok" del TAP (indentadas o no)
          # con el detalle que les sigue.
          awk '
            /(^|[[:space:]])not ok / {
              print "::error title=Kronos E2E Atlas TAP::" substr($0, 1, 300)
              capturar = 10
              next
            }
            capturar > 0 { print "::error title=Kronos E2E Atlas TAP detalle::" substr($0, 1, 300); capturar-- }
          ' /tmp/kronos-atlas-e2e.txt | head -40

          # Prioridad 3: con fallos pero sin ninguna de las dos senales,
          # volcar cabecera y colas del archivo para ver su formato real
          # (solo en corridas con fallos, para no llenar de anotaciones
          # las corridas verdes).
          fail_n=$(sed -n 's/^# fail //p' /tmp/kronos-atlas-e2e.txt | head -1)
          if ! grep -q "not ok\|KRONOS_E2E_FAIL" /tmp/kronos-atlas-e2e.txt && [ "${fail_n:-0}" != "0" ]; then
            head -n 45 /tmp/kronos-atlas-e2e.txt | nl -ba | while IFS= read -r linea; do
              echo "::notice title=E2E Atlas cabecera::${linea:0:200}"
            done
            tail -n 35 /tmp/kronos-atlas-e2e.txt | nl -ba | while IFS= read -r linea; do
              echo "::notice title=E2E Atlas cola::${linea:0:200}"
            done
          fi

          exit $exit_code

      - name: Avisar si la guarda omitió todo el E2E
        if: always()
        run: |
          set -uo pipefail
          salida=/tmp/kronos-atlas-e2e.txt
          [ -f "$salida" ] || exit 0

          ejecutados="$(grep -E '^# pass' "$salida" | head -1 | grep -oE '[0-9]+' || echo 0)"
          omitidos="$(grep -E '^# skipped' "$salida" | head -1 | grep -oE '[0-9]+' || echo 0)"

          # Verde por no haber hecho nada es peor que rojo: parece cobertura.
          if [ "${ejecutados:-0}" -eq 0 ] && [ "${omitidos:-0}" -gt 0 ]; then
            echo "::warning title=E2E contra Atlas OMITIDO::La guarda de destino no pudo demostrar que el clúster es de pruebas, así que se omitieron ${omitidos} pruebas y NO se ejecutó ninguna. Declara los hosts en la variable de repositorio E2E_CLUSTER_ALLOWLIST (Settings → Secrets and variables → Actions → Variables) para que el E2E contra Atlas vuelva a cubrir algo."
            {
              echo "### E2E contra Atlas — OMITIDO por la guarda de destino"
              echo
              echo "Se omitieron **${omitidos}** pruebas y se ejecutaron **0**."
              echo "Este job está en verde porque no escribió en ningún sitio, no porque haya verificado nada."
              echo
              echo "Para reactivarlo: declara el host del clúster de pruebas en la variable"
              echo "de repositorio \`E2E_CLUSTER_ALLOWLIST\` (por ejemplo \`cluster0.xxxxx.mongodb.net\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Publicar informe del E2E contra Atlas
        if: always() && steps.secreto.outputs.disponible == 'true'
        continue-on-error: true
        env:
          SHA: ${{ github.sha }}
        run: |
          set +e

          if [ ! -f /tmp/kronos-atlas-e2e.txt ]; then
            echo "Sin salida del E2E contra Atlas"
            exit 0
          fi

          resumen=$(grep -E "^# (tests|pass|fail|skipped)" /tmp/kronos-atlas-e2e.txt | tr '\n' ' ')
          echo "::notice title=Kronos E2E resumen (Atlas)::${resumen:-sin resumen legible}"

          {
            echo "### Kronos E2E — Atlas (secreto KRONOS_E2E_MONGODB_URI)"
            echo
            printf 'Commit: `%s`\n' "${SHA:0:7}"
            echo
            echo '```text'
            tail -n 120 /tmp/kronos-atlas-e2e.txt
            echo '```'
          } > /tmp/kronos-atlas-report.md

          # Ídem mongo:7 — el informe vive en el resumen del run.
          tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}" < /tmp/kronos-atlas-report.md

          exit 0




      - name: Guardar salida del E2E contra Atlas
        if: always() && steps.secreto.outputs.disponible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kronos-atlas-e2e-${{ github.run_id }}
          path: /tmp/kronos-atlas-e2e.txt
          if-no-files-found: warn

name: Kronos E2E (MongoDB real)

# Ejecuta la verificación real del bloque 007-016 y de la autenticación
# end-to-end contra el MongoDB del proyecto. Sin `MONGODB_URI` el job se
# omite con aviso: las pruebas NO se sustituyen por persistencia simulada.
#
# Configuración (una sola vez):
#   Settings → Secrets and variables → Actions → New repository secret
#   MONGODB_URI  = mongodb+srv://…/kronos_social_ai
#
# Las pruebas crean su propia base temporal `kronos_e2e_<aleatorio>` y la
# eliminan al terminar; nunca escriben en la base del despliegue.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-e2e-secret-not-used-in-production' }}
  NODE_ENV: test

jobs:
  mongo-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Aviso si falta MONGODB_URI
        if: ${{ env.MONGODB_URI == '' }}
        run: |
          echo "::warning title=MONGODB_URI no configurado::El E2E real del bloque 007-016 queda omitido. Agrega el secreto MONGODB_URI para ejecutarlo contra MongoDB."

      - name: Pruebas E2E contra MongoDB real
        if: ${{ env.MONGODB_URI != '' }}
        run: npm run test:e2e

      - name: Suites sin base de datos
        run: |
          npm test --workspace=server
          npm test --workspace=client

      - name: Build cliente
        run: npm run build --workspace=client

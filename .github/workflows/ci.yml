name: Kronos Space - CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls --all

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Validate server syntax
        run: node --check server/src/server.js

      - name: Validate OpenRouter modules and smoke test syntax
        run: |
          node --check server/src/config/openrouter.js
          node --check server/src/modules/image-ai/image.capabilities.js
          node --check scripts/openrouter-smoke.js

      - name: Validate auth and core modules syntax
        run: |
          node --check server/src/middleware/auth.js
          node --check server/src/modules/auth/auth.routes.js
          node --check server/src/modules/auth/session.routes.js
          node --check server/src/modules/auth/session.service.js
          node --check server/src/modules/moderation/moderation.routes.js
          node --check server/src/modules/moderation/moderation.service.js
          node --check server/src/modules/drafts/drafts.routes.js
          node --check server/src/modules/posts/posts.routes.js
          node --check server/src/modules/users/users.routes.js
          node --check server/src/modules/search/search.routes.js
          node --check server/src/modules/admin/admin.routes.js
          node --check server/src/modules/observability/observability.routes.js
          node --check server/src/middleware/requestContext.js
          node --check server/src/middleware/requireAdmin.js

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run client tests
        working-directory: client
        run: npm test

      # Verificación de SOLO LECTURA contra los despliegues reales
      # (Render + Cloudflare Pages/Vercel). No crea ni modifica datos.
      # No bloquea el merge: informa si la configuración del entorno
      # (CLIENT_URL en Render, VITE_API_URL en el frontend) necesita ajuste.
      - name: Verify deployed environment (read-only)
        id: verify_deploy
        continue-on-error: true
        env:
          BASE: https://api.kronos-space.com
          # Único frontend público. Los alias deben redirigir aquí, no operar
          # como una segunda versión que el usuario tenga que elegir.
          FRONTEND: https://kronos-space.com
          FRONTEND_ALT: ""
          ORIGINS: https://kronos-space.com,https://www.kronos-space.com
        run: |
          set -o pipefail
          bash scripts/verify-deploy.sh | tee /tmp/verify-deploy.txt

      - name: Publish deploy report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy.txt
            echo '```'
          } > /tmp/report.md

          gh pr comment "$PR" --body-file /tmp/report.md || echo "No se pudo publicar el informe"

      # En push (main/develop) no hay PR: el informe se publica como
      # comentario del commit, que queda legible en la interfaz y por API.
      - name: Publish deploy report (push)
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Commit: \`${SHA:0:7}\`"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy.txt
            echo '```'
          } > /tmp/report-push.md

          gh api "repos/${REPO}/commits/${SHA}/comments" -F body=@/tmp/report-push.md > /dev/null \
            || echo "No se pudo publicar el informe"

name: Kronos Post-Deploy Verify

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base:
        required: true
        default: "https://api.kronos-space.com"
      frontend:
        required: true
        default: "https://kronos-space.com"
      origins:
        required: true
        default: "https://kronos-space.com,https://www.kronos-space.com"

permissions:
  contents: read

concurrency:
  group: kronos-post-deploy-${{ github.event_name }}-${{ github.event.deployment.environment || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify deployed environment
        env:
          BASE: ${{ github.event.deployment.environment == 'production' && 'https://api.kronos-space.com' || inputs.base || 'https://api.kronos-space.com' }}
          FRONTEND: ${{ inputs.frontend || 'https://kronos-space.com' }}
          ORIGINS: ${{ inputs.origins || 'https://kronos-space.com,https://www.kronos-space.com' }}
          HEALTH_ATTEMPTS: "6"
          HEALTH_DELAY: "5"
          CORS_ATTEMPTS: "6"
          CORS_DELAY: "5"
          FRONTEND_ATTEMPTS: "6"
          FRONTEND_DELAY: "5"
        run: |
          set -euo pipefail
          bash scripts/verify-deploy.sh

name: Kronos Space - CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

# Igual que en kronos-e2e.yml: sin esto cada push deja viva la corrida anterior.
# Aquí no hay base de datos compartida, pero sí minutos de runner y checks
# duplicados en el PR. En pull_request gana la última; en main no se cancela.
concurrency:
  group: kronos-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Un job colgado no puede consumir tiempo sin límite.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (including development tools)
        run: npm run audit:dependencies

      - name: Validate dependency tree
        run: npm ls --all

      # `npm run lint` cubre los cuatro paquetes: el cliente con sus reglas de
      # React (client/eslint.config.js) y server/scripts/guardian con el núcleo
      # de corrección (eslint.config.js de la raíz).
      #
      # Antes solo se lintaba `client/src`, y con dos reglas. Server, scripts y
      # guardian no tenían lint de ningún tipo: los pasos de `node --check` de
      # más abajo cubren 18 archivos elegidos a mano de los 147, así que 104 de
      # server/src no se comprobaban ni por sintaxis. Por ahí entró un require a
      # una carpeta inexistente silenciado por un catch vacío.
      - name: Lint (client, server, scripts, guardian)
        run: npm run lint

      - name: Build client
        run: npm run build

      # El barrido cruza cada className del codigo contra el CSS construido:
      # si una utilidad del motor se queda sin regla, la geometria se cae sin
      # avisar (fue el defecto del 2026-09/10). Falla si aparece una.
      - name: Sweep inert utilities
        run: node scripts/ci/barrido-utilidades.mjs --estricto

      - name: Validate server syntax
        run: node --check server/src/server.js

      - name: Validate OpenRouter modules and smoke test syntax
        run: |
          # set -euo pipefail es obligatorio aquí: en un bloque multilínea el
          # exit code del paso es el del ÚLTIMO comando, así que sin esto un
          # `node --check` intermedio podía fallar y el paso quedaba en verde.
          set -euo pipefail
          node --check server/src/config/openrouter.js
          node --check server/src/modules/image-ai/image.capabilities.js
          node --check scripts/openrouter-smoke.js

      - name: Validate auth and core modules syntax
        run: |
          # Ídem: 14 comprobaciones en serie; sin esto solo contaba la última.
          set -euo pipefail
          node --check server/src/middleware/auth.js
          node --check server/src/modules/auth/auth.routes.js
          node --check server/src/modules/auth/session.routes.js
          node --check server/src/modules/auth/session.service.js
          node --check server/src/modules/moderation/moderation.routes.js
          node --check server/src/modules/moderation/moderation.service.js
          node --check server/src/modules/drafts/drafts.routes.js
          node --check server/src/modules/posts/posts.routes.js
          node --check server/src/modules/users/users.routes.js
          node --check server/src/modules/search/search.routes.js
          node --check server/src/modules/admin/admin.routes.js
          node --check server/src/modules/observability/observability.routes.js
          node --check server/src/middleware/requestContext.js
          node --check server/src/middleware/requireAdmin.js

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Run client tests
        working-directory: client
        run: npm test

      # Verificación de SOLO LECTURA contra los despliegues reales
      # (Render + Cloudflare Pages/Vercel). No crea ni modifica datos.
      # No bloquea el merge: informa si la configuración del entorno
      # (CLIENT_URL en Render, VITE_API_URL en el frontend) necesita ajuste.
      - name: Verify deployed environment (read-only)
        id: verify_deploy
        continue-on-error: true
        env:
          BASE: https://api.kronos-space.com
          # Único frontend público. Los alias deben redirigir aquí, no operar
          # como una segunda versión que el usuario tenga que elegir.
          FRONTEND: https://kronos-space.com
          FRONTEND_ALT: ""
          ORIGINS: https://kronos-space.com,https://www.kronos-space.com
        run: |
          set -o pipefail
          bash scripts/verify-deploy.sh | tee /tmp/verify-deploy.txt

      - name: Publish deploy report
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy.txt
            echo '```'
          } > /tmp/report.md

          gh pr comment "$PR" --body-file /tmp/report.md || echo "No se pudo publicar el informe"

      # En push (main/develop) no hay PR: el informe se publica como
      # comentario del commit, que queda legible en la interfaz y por API.
      - name: Publish deploy report (push)
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Verificación de despliegue (solo lectura)"
            echo
            echo "Commit: \`${SHA:0:7}\`"
            echo
            echo "Resultado: **${{ steps.verify_deploy.outcome }}**"
            echo
            echo '```'
            cat /tmp/verify-deploy.txt
            echo '```'
          } > /tmp/report-push.md

            gh api "repos/${REPO}/commits/${SHA}/comments" -F body=@/tmp/report-push.md > /dev/null \
              || echo "No se pudo publicar el informe"

  # Las pruebas de navegador (Playwright) existían desde antes pero ningún
  # workflow las corría: solo se ejecutaban a mano en una máquina con los dos
  # servidores levantados. Aquí entran al CI como job propio, con el mismo
  # navegador (Chromium) que instala el runner. La propia configuración de la
  # suite arranca los dos servidores que necesita (la app y el modo
  # design-preview), así que el job no prepara nada a mano.
  #
  # Va separado de `validate` a propósito: si el navegador del runner falla al
  # instalar o la suite se cuelga, el resto del CI ya quedó verde y se ve de qué
  # lado está el problema.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Build production artifact for browser tests
        run: npm run build

      - name: Browser tests (Playwright, production artifact)
        env:
          KRONOS_BROWSER_PRODUCTION: "1"
        working-directory: client
        run: npm run test:browser

      # El informe solo importa cuando algo falla, pero se sube siempre para que
      # la corrida en verde también deje constancia de lo que se ejecutó.
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kronos-browser-${{ github.run_id }}
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

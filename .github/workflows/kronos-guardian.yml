name: Kronos Guardian

# QUÉ BLOQUEA UN MERGE Y QUÉ NO.
#
# El guardián comenta siempre en el PR con el riesgo de cada archivo tocado.
# Además FALLA el job (y por tanto el check) solo cuando el riesgo general es
# CRITICAL, que es un conjunto corto y explícito declarado en
# guardian/src/riskEvaluator.js -> RUTAS_CRITICAS: cifrado de cápsulas,
# clasificador de entorno, guarda de migraciones, cookie de media y política de
# nombres de la copia durable. Son archivos donde un error es irreversible o
# desactiva varias protecciones a la vez.
#
# Todo lo demás —incluido tocar autenticación, que puntúa HIGH— se informa sin
# bloquear. Cambiar la lista cambia lo que bloquea; las reglas están cubiertas
# por guardian/test/riskEvaluator.test.js.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: kronos-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardian-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./guardian
        run: npm ci

      - name: Validate dependency tree
        working-directory: ./guardian
        run: npm ls --all

      - name: Validate Guardian syntax
        working-directory: ./guardian
        # find -exec ... \; devuelve éxito aunque node --check falle.
        # xargs propaga el error y -print0 conserva rutas con espacios.
        run: |
          set -euo pipefail
          find src -name '*.js' -print0 | xargs -0 -r -n 1 node --check

      # Las reglas de riesgo se comprueban antes de aplicarlas. Son puras
      # (src/classify.js y src/riskEvaluator.js no arrastran el cliente de
      # GitHub), así que corren sin GITHUB_TOKEN y sin red.
      #
      # El caso decisivo: index.js falla el job cuando el riesgo general es
      # CRITICAL, y hasta ahora ninguna regla podía producir ese nivel. La rama
      # era inalcanzable y este check pasaba siempre en verde, diera igual lo
      # que tocara el PR.
      - name: Test risk rules
        working-directory: ./guardian
        run: npm test

      - name: Run Kronos Guardian
        working-directory: ./guardian
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node src/index.js

